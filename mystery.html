html,body{margin:0;height:100%;background:#0d0820;color:#f4eefc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:radial-gradient(circle at 50% 0,#2b1657,#0d0820 70%)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(#1c1040,#150b30);border-bottom:2px solid #6d3fd1}
.top .bk{background:#2b1a5c;border-radius:10px;padding:7px 10px;font-weight:800;font-size:13px}
.top h1{font-size:15px;margin:0;flex:1;line-height:1.1;font-weight:900;color:#ffd86b;text-shadow:0 2px 0 #0008}
.top h1 small{display:block;font-size:10.5px;color:#b9a4ef;font-weight:700}
body.arc .top{padding-left:50px}body.arc .top .bk:not(.in){display:none}
.chip{background:#0d0820;border:1.5px solid #6d3fd1;border-radius:12px;padding:4px 8px;font-weight:900;font-size:13px;white-space:nowrap}
.main{flex:1;overflow:auto;padding:10px;position:relative}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#150b30;border-top:2px solid #6d3fd1}
.tabs button{background:#24155070;border-radius:12px;padding:8px 2px;font-weight:800;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid transparent}
.tabs button i{font-style:normal;font-size:19px}
.tabs button.on{background:linear-gradient(#7c4dff,#5327c9);border-color:#c9b3ff;box-shadow:0 0 14px #7c4dff88}
.tabs button.acc{background:linear-gradient(#ff6b4a,#c62828)}
.card{background:linear-gradient(160deg,#2a1a58,#1a1038);border:1.5px solid #5b3bb0;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 6px 0 #0005}

.sec{background:#2b1a5c;border:1.5px solid #6d3fd1;border-radius:12px;padding:10px 12px;font-weight:800}

.scene svg{display:block;width:100%;height:auto}
.prop{cursor:pointer}.prop.done{opacity:.55;cursor:default}

.say b{color:#b3261e}.say .who{font-size:11px;font-weight:900;color:#6d3fd1;display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.room{border-radius:14px;padding:10px;min-height:86px;text-align:left;font-weight:900;font-size:14px;position:relative;overflow:hidden;border:2px solid #ffffff22;box-shadow:0 5px 0 #0006;color:#fff}
.room i{font-style:normal;font-size:30px;display:block}.room small{display:block;font-size:11px;font-weight:700;opacity:.85}
.room.here{border-color:#ffd86b;box-shadow:0 5px 0 #0006,0 0 16px #ffd86b88}

.sus{display:flex;gap:10px;align-items:center;position:relative}
.sus svg{width:74px;height:86px;flex:none;border-radius:12px;background:#0d0820}
.sus h3{margin:0 0 2px;font-size:15px}.sus p{margin:0;font-size:12px;color:#cbbcf5;line-height:1.35}

.sus.out{opacity:.45}.sus.out:after{content:"✕";position:absolute;right:8px;top:0;font-size:44px;color:#ff5252;font-weight:900}
.sus .x{position:absolute;right:0;bottom:0;background:#0d0820;border:1px solid #6d3fd1;border-radius:9px;padding:4px 8px;font-size:11px;font-weight:800}

.hero{text-align:center;padding:6px 0}
.hero svg{width:100%;max-width:400px;height:auto}
.ov{position:absolute;inset:0;background:#080414ee;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.ov h2{font-size:26px;margin:6px 0;color:#ffd86b;text-shadow:0 3px 0 #000}
.bar{width:100%;max-width:340px;height:34px;border-radius:17px;background:#1c1040;border:3px solid #fff;position:relative;overflow:hidden;margin:14px 0}
.bar .z{position:absolute;top:0;bottom:0;background:linear-gradient(#4ade80,#16a34a)}.bar .m{position:absolute;top:-3px;bottom:-3px;width:8px;margin-left:-4px;background:#fff;border-radius:4px;box-shadow:0 0 10px #fff}

.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}

.pet{font-size:34px;line-height:1}.pet img{width:40px;height:40px;object-fit:contain;border-radius:8px}
.fog{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 60%,#ffffff10,transparent 40%),radial-gradient(circle at 75% 40%,#ffffff0c,transparent 45%);animation:fog 9s ease-in-out infinite alternate}@keyframes fog{to{transform:translateX(18px)}}
.stat{display:flex;justify-content:space-around;font-weight:900;font-size:13px;color:#cbbcf5}.stat b{display:block;font-size:20px;color:#fff}
