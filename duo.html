<!doctype html>
<html lang="en"><head><script src="bc-hh.js"></script><script src="bc-extras.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Together Arcade</title>
<meta name="theme-color" content="#0f0b1e">
<style>
:root{--bg:#0f0b1e;--card:#1a1433;--line:#322a5e;--ink:#f3f0ff;--mut:#a79fd6;--a:#ff4d8d;--b:#35c8ff;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 20% 0,#2a1b5e 0,var(--bg) 55%) fixed;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 40px}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px}
body.arc h1{padding-left:44px}h1{font-size:20px;margin:6px 0 2px;display:flex;align-items:center;gap:8px}h1 a{color:var(--mut);text-decoration:none;font-size:14px;margin-left:auto}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.gc{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;font-weight:800}.gc:active{transform:scale(.97)}.gc .i{font-size:34px;display:block}.gc small{display:block;color:var(--mut);font-weight:600;font-size:11.5px;margin-top:2px}
button{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}button.pri{background:linear-gradient(90deg,#7c3aed,#ec4899);border-color:transparent}button.ok{background:#15803d;border-color:#4ade80}button.bad{background:#7f1d1d;border-color:#ef4444}button:disabled{opacity:.4}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.bar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pl{flex:1;border:2px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center;font-weight:800;font-size:13px}.pl.a{border-color:var(--a)}.pl.b{border-color:var(--b)}.pl.turn{background:#ffffff14;box-shadow:0 0 12px currentColor}.pl b{display:block;font-size:20px}
.code{font-size:34px;letter-spacing:8px;font-weight:900;text-align:center;color:var(--ok)}
input,select{font:inherit;background:#0c0820;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px;max-width:100%}
.banner{text-align:center;font-weight:900;font-size:18px;padding:10px;border-radius:12px;background:#ffffff14;margin:8px 0}
/* boards */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#1d4ed8;padding:6px;border-radius:14px}.c4 i{aspect-ratio:1;border-radius:50%;background:#0c0820;display:block}.c4 i.a{background:var(--a)}.c4 i.b{background:var(--b)}.c4 i.w{outline:3px solid #fff}
.c4h{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 6px;margin-bottom:4px}.c4h button{padding:6px 0;font-size:16px}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ttt button{aspect-ratio:1;font-size:46px;padding:0}
.ck{display:grid;grid-template-columns:repeat(8,1fr);border:3px solid #5b3a1a}.ck div{aspect-ratio:1;display:grid;place-items:center;position:relative}.ck .d{background:#7b4a22}.ck .l{background:#e8c99b}.ck .sel{outline:3px solid var(--warn);outline-offset:-3px}.ck .tg::after{content:"";width:34%;height:34%;border-radius:50%;background:#4ade80aa;position:absolute}
.pc{width:76%;height:76%;border-radius:50%;display:grid;place-items:center;font-size:14px;box-shadow:inset 0 -3px 0 #0006,0 2px 3px #0008}.pc.a{background:var(--a)}.pc.b{background:var(--b)}
.rv{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#064e3b;padding:3px;border-radius:8px}.rv div{aspect-ratio:1;background:#047857;display:grid;place-items:center;position:relative}.rv .pc{width:80%;height:80%}.rv .tg::after{content:"";width:26%;height:26%;border-radius:50%;background:#ffffff77;position:absolute}
.bs{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin:6px 0}.bs div{aspect-ratio:1;background:#0b2a4a;border-radius:4px;display:grid;place-items:center;font-size:14px}.bs .sh{background:#1e3a8a}.bs .hit{background:#b91c1c}.bs .miss{background:#334155}.bs .sunk{background:#7f1d1d}.bs.me div.s{background:#475569}
.mem{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.mem button{aspect-ratio:1;font-size:26px;padding:0}.mem button.up{background:#fff2}.mem button.own-a{border-color:var(--a)}.mem button.own-b{border-color:var(--b)}
.big{font-size:60px;text-align:center}.ch{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ch button{font-size:28px;padding:10px 0}
.opt{display:grid;gap:8px}.opt button{text-align:left;padding:12px}.opt button.right{background:#15803d;border-color:#4ade80}.opt button.wrong{background:#7f1d1d;border-color:#ef4444}.opt button.pick{border-color:var(--warn)}
.tm{height:8px;background:#ffffff1a;border-radius:6px;overflow:hidden;margin:6px 0}.tm i{display:block;height:100%;background:var(--warn);width:100%}
.react{height:220px;border-radius:18px;display:grid;place-items:center;font-size:26px;font-weight:900;text-align:center;user-select:none;touch-action:manipulation;cursor:pointer}
.dab svg{width:100%;height:auto;display:block;background:#0c0820;border-radius:12px}
.hid{display:none}

/* build 21: arcade cabinet carousel */
:root{--pix:'Press Start 2P',ui-monospace,Menlo,monospace}
.car-wrap{position:relative;margin:8px -14px}
.carousel{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:16px calc(50% - 104px) 26px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.carousel::-webkit-scrollbar{display:none}
.slot{flex:0 0 208px;scroll-snap-align:center;display:flex;justify-content:center;perspective:900px}
.car-arrow{position:absolute;top:50%;transform:translateY(-60%);z-index:5;width:36px;height:60px;border-radius:12px;border:1px solid #ffffff22;background:#0d0b1acc;color:#fff;font-size:26px;padding:0 0 4px}
.car-arrow.l{left:6px}.car-arrow.r{right:6px}
.car-count{text-align:center;font-family:var(--pix);font-size:8px;color:var(--mut);margin-top:-14px;margin-bottom:6px}
.cab{--c2:#333;position:relative;width:188px;height:332px;border-radius:16px 16px 8px 8px;cursor:pointer;will-change:transform;transform-origin:50% 60%;background:linear-gradient(90deg,#08070f 0,#1d1a30 7%,#2a2545 50%,#1d1a30 93%,#08070f 100%);box-shadow:0 0 0 2px #000,0 22px 30px -6px #000c,0 0 0 1px var(--c) inset;transition:filter .25s}
.cab::before,.cab::after{content:'';position:absolute;top:56px;bottom:12px;width:4px;border-radius:4px;background:var(--c);box-shadow:0 0 10px var(--c),0 0 22px var(--c);opacity:.7}
.cab::before{left:3px}.cab::after{right:3px}
.cab.dim{filter:brightness(.55) saturate(.7)}
.cab-marq{position:relative;height:50px;border-radius:16px 16px 4px 4px;background:linear-gradient(180deg,var(--c),var(--c2));display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;font-family:var(--pix);font-size:9px;line-height:1.55;color:#fff;text-shadow:0 2px 0 #0009,0 0 8px #000;box-shadow:0 0 24px var(--cg),inset 0 0 0 2px #ffffff45,inset 0 -6px 12px #0005;overflow:hidden}
.cab-marq::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#ffffff40,transparent 45%)}
.cab.focus .cab-marq{animation:marq 1.6s ease-in-out infinite}
@keyframes marq{0%,100%{box-shadow:0 0 24px var(--cg),inset 0 0 0 2px #ffffff45,inset 0 -6px 12px #0005}50%{box-shadow:0 0 40px var(--c),inset 0 0 0 2px #ffffff80,inset 0 -6px 12px #0005}}
.new-tag{position:absolute;top:-8px;right:-6px;z-index:3;background:#ffea00;color:#000;font-family:var(--pix);font-size:7px;padding:5px 6px;border-radius:6px;transform:rotate(8deg)}
.cab-bez{margin:8px 10px 0;padding:7px;background:linear-gradient(#0b0a12,#16142a);border-radius:12px;box-shadow:inset 0 0 0 2px #2c2846}
.cab-scr{position:relative;height:124px;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 42%,var(--cg),#05040a 72%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cab-scr::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 2px,#0006 2px 3px),radial-gradient(circle at 30% 10%,#ffffff1a,transparent 45%);pointer-events:none}
.cab-ico{position:relative;font-size:54px;line-height:1;filter:drop-shadow(0 0 12px var(--c)) drop-shadow(0 4px 2px #000a)}
.cab.focus .cab-ico{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.cab-hi{position:relative;font-family:var(--pix);font-size:7px;color:#fff;margin-top:9px;text-shadow:0 0 6px var(--c)}
.cab-press{position:absolute;bottom:7px;font-family:var(--pix);font-size:7px;color:var(--c);opacity:0}
.cab.focus .cab-press{animation:blink 1s steps(2) infinite}
@keyframes blink{0%{opacity:1}100%{opacity:0}}
.cab-panel{margin:12px 4px 0;height:50px;border-radius:8px;background:linear-gradient(#37325a,#1c1932);transform:perspective(220px) rotateX(32deg);display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:inset 0 2px 0 #ffffff22,0 6px 0 #0007}
.stick{position:relative;width:24px;height:24px}.stick::before{content:'';position:absolute;left:50%;bottom:2px;width:4px;height:18px;margin-left:-2px;background:#bbb;border-radius:2px}
.stick::after{content:'';position:absolute;left:50%;top:-6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 45%,#000 130%)}
.pb{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffffcc,var(--pc,#ff1744) 45%,#000 140%);box-shadow:0 3px 0 #000}
.cab-coin{margin:14px auto 0;width:96px;height:66px;border-radius:8px;background:linear-gradient(#1a1828,#0c0b14);box-shadow:inset 0 0 0 2px #2c2846;display:flex;gap:14px;align-items:center;justify-content:center}
.slotc{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--pix);font-size:6px;color:#ff9e80}.slotc i{display:block;width:12px;height:22px;border-radius:3px;background:#000;box-shadow:0 0 0 2px #4a4560,inset 0 0 8px #ff3d00}
.ginfo{background:linear-gradient(160deg,#1c1836,#120f24);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.gi-name{font-family:var(--pix);font-size:12px;line-height:1.5;color:var(--gc);text-shadow:0 0 10px var(--gc)}
.play-btn{width:100%;border:0;border-radius:14px;padding:15px;font-family:var(--pix);font-size:13px;color:#000;background:linear-gradient(180deg,#fff,var(--gc) 35%);cursor:pointer;margin-top:10px}

/* build 23: board facelift, animations, reactions */
.c4{background:linear-gradient(180deg,#2563eb,#1e3a8a);box-shadow:inset 0 2px 0 #ffffff33,0 10px 24px #0008;padding:8px;border-radius:16px;overflow:hidden}
.c4 i{box-shadow:inset 0 3px 6px #000c}
.c4 i.a,.pc.a{background:radial-gradient(circle at 35% 30%,#ffd1e2,var(--a) 48%,#9d174d)!important;box-shadow:0 2px 4px #0007,inset 0 -3px 0 #0003}
.c4 i.b,.pc.b{background:radial-gradient(circle at 35% 30%,#d4f4ff,var(--b) 48%,#075985)!important;box-shadow:0 2px 4px #0007,inset 0 -3px 0 #0003}
.c4 i.w,.ttt button.w,.gm5 i.w{animation:glow .8s ease-in-out infinite alternate}
.c4h button{background:linear-gradient(#2a2250,#1a1433)}
.new{animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
.c4 i.new{animation:drop .5s cubic-bezier(.55,0,.75,1.35)}
.pc.flip{animation:flip .5s ease}
@keyframes drop{from{transform:translateY(-640%)}to{transform:none}}
@keyframes popin{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{from{box-shadow:0 0 0 0 #fff0}to{box-shadow:0 0 16px 5px #fde047cc}}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(1.15)}100%{transform:rotateY(0)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .45s}
.lm{box-shadow:inset 0 0 0 3px #fde047!important}
.rv{background:linear-gradient(#047857,#064e3b);padding:5px;border-radius:12px;box-shadow:0 10px 24px #0008}
.rv div{background:radial-gradient(circle at 50% 40%,#10b981,#047857)}
.rv .tg::after{content:'';width:24%;height:24%;border-radius:50%;background:#ffffff66;box-shadow:0 0 8px #fff8}
.ck{border-radius:10px;overflow:hidden;box-shadow:0 10px 24px #0009,0 0 0 4px #78350f}
.ck .d{background:linear-gradient(135deg,#8b5a2b,#6b3f1d)!important}.ck .l{background:linear-gradient(135deg,#f3dfb8,#e2c28f)!important}
.ck .can .pc{box-shadow:0 0 0 3px #fde047,0 2px 4px #0007}
.ck .tg::after{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:#fde047aa}
.ttt button{background:linear-gradient(#2a2250,#1a1433);font-weight:900;text-shadow:0 0 14px currentColor}
.mem button{background:linear-gradient(135deg,#3b2a7a,#1a1433);transition:transform .2s}.mem button.up{background:linear-gradient(135deg,#fff3,#fff1)}
.bs div{transition:background .2s}.bs .hit,.bs .sunk{animation:popin .35s}
.rxbar{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}.rxbar button{font-size:20px;padding:6px 9px;background:#ffffff0d;border-color:#ffffff22}
.rxf{position:fixed;font-size:48px;pointer-events:none;z-index:60;animation:rise 2.4s ease-out forwards;filter:drop-shadow(0 4px 6px #000a)}
@keyframes rise{0%{transform:translateY(0) scale(.4);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.15)}100%{transform:translateY(-300px) scale(1);opacity:0}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:70}
/* build 23: new games */
.chb{display:grid;grid-template-columns:repeat(8,1fr);border-radius:10px;overflow:hidden;box-shadow:0 10px 24px #0009,0 0 0 4px #3f2a14;aspect-ratio:1}
.chb div{position:relative;display:grid;place-items:center;aspect-ratio:1}.chb .l{background:#eed9b5}.chb .d{background:#b07a47}
.chb .sel{background:#fde047!important}.chb .chk{background:radial-gradient(#ef4444,#7f1d1d)!important}
.chb .tg::after{content:'';width:28%;height:28%;border-radius:50%;background:#0006}.chb .tgx{box-shadow:inset 0 0 0 4px #0007}
.chb .can .cp{filter:drop-shadow(0 0 4px #fde047)}
.cp{font-size:min(9vw,40px);line-height:1;user-select:none}.cp.a{color:#fff;text-shadow:0 0 1px #000,0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000,0 3px 4px #0008}.cp.b{color:#1c1917;text-shadow:0 0 1px #fff8,0 2px 3px #0006}
.chb i{position:absolute;font-size:9px;font-style:normal;color:#0008;font-weight:800}.chb .rk{left:2px;top:1px}.chb .fl{right:3px;bottom:1px}
.chcap{min-height:24px;display:flex;flex-wrap:wrap;gap:1px;margin:4px 0}.chcap .cp{font-size:18px}
.mcl{display:flex;gap:6px;align-items:stretch;background:linear-gradient(#7c4a1e,#4a2a0e);padding:8px;border-radius:40px;box-shadow:inset 0 2px 0 #fff3,0 10px 24px #0009}
.mst{width:54px;border-radius:30px;background:#2a1606;box-shadow:inset 0 4px 10px #000c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fde68a}.mst small{font-size:10px;color:#d6b48a;font-weight:700;max-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mst.me{color:#86efac}
.mrows{flex:1;display:flex;flex-direction:column;gap:6px}.mrow{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.mpit{position:relative;aspect-ratio:1;border-radius:50%;padding:0;background:#2a1606;border:0;box-shadow:inset 0 4px 10px #000c;color:#fde68a}.mpit i{position:absolute;width:18%;height:18%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a3e635 40%,#3f6212)}.mpit b{position:absolute;right:4px;bottom:2px;font-size:11px}.mpit:not([disabled]){box-shadow:inset 0 4px 10px #000c,0 0 0 2px #86efac}
.ctable{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0}.csuit{font-size:13px;color:var(--mut);text-align:center}.csuit b{font-size:28px;color:#fff}.csuit b.red{color:#f43f5e}
.crow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:6px 0}.crow.opp .crd{width:30px;height:44px}
.crd{position:relative;width:54px;height:78px;border-radius:8px;background:linear-gradient(#fff,#ececec);color:#111;border:1px solid #0004;box-shadow:0 3px 6px #0007;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,serif}
.crd b{position:absolute;left:4px;top:2px;font-size:13px}.crd b.bt{left:auto;top:auto;right:4px;bottom:2px;transform:rotate(180deg)}.crd span{font-size:26px}.crd.red{color:#dc2626}
.crd.back{background:repeating-linear-gradient(45deg,#7c3aed 0 6px,#5b21b6 6px 12px);border:2px solid #fff}.crd.deck{width:54px;height:78px;color:#fff;font-weight:900}.crd.ok{transform:translateY(-6px);box-shadow:0 0 0 2px #4ade80,0 6px 10px #0008}.crd.dim{opacity:.55}
.dtray{display:flex;justify-content:center;gap:8px;margin:8px 0 10px}
.die{width:52px;height:52px;padding:6px;border-radius:12px;background:linear-gradient(#fff,#e5e5e5);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;box-shadow:0 4px 0 #9ca3af,0 6px 10px #0006;border:0}
.die i{border-radius:50%}.die i.on{background:radial-gradient(circle at 35% 35%,#555,#111)}.die.held{box-shadow:0 0 0 3px #fbbf24,0 4px 0 #b45309;transform:translateY(3px)}.die.roll{animation:dspin .5s ease}
@keyframes dspin{0%{transform:rotate(0) scale(.7)}60%{transform:rotate(300deg) scale(1.1)}100%{transform:rotate(360deg)}}
.dsc{width:100%;border-collapse:collapse;font-size:13px}.dsc td,.dsc th{padding:4px 6px;border-bottom:1px solid #ffffff12;text-align:center}.dsc td:first-child{text-align:left}.dsc .sub td{color:var(--mut)}.dsc .dsel{background:#14532d;border-color:#4ade80;padding:3px 10px}
.hang{width:60%;max-width:220px;display:block;margin:0 auto}
.wslot{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:10px 0}.wslot i{width:26px;height:34px;border-bottom:3px solid #a79fd6;font-style:normal;font-size:24px;font-weight:900;text-align:center;color:#fde68a}.wslot i.sp{border:0;width:14px}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.keys button{padding:8px 0}.keys .hit{background:#14532d;border-color:#4ade80}.keys .miss{background:#3f0d0d;opacity:.5}
.gm5{display:grid;grid-template-columns:repeat(13,1fr);background:linear-gradient(#e7c27d,#c99a4c);padding:6px;border-radius:10px;box-shadow:0 10px 24px #0009;aspect-ratio:1}
.gm5 i{position:relative;aspect-ratio:1;background:linear-gradient(#0004,#0004) center/1px 100% no-repeat,linear-gradient(#0004,#0004) center/100% 1px no-repeat}
.gm5 i.s::after{content:'';position:absolute;inset:8%;border-radius:50%}.gm5 i.a::after{background:radial-gradient(circle at 35% 30%,#ffd1e2,var(--a) 50%,#9d174d)}.gm5 i.b::after{background:radial-gradient(circle at 35% 30%,#d4f4ff,var(--b) 50%,#075985)}.gm5 i.lm::after{box-shadow:0 0 0 2px #fde047}
.cpal{display:flex;gap:6px;justify-content:center;margin:8px 0}.cpal button{width:40px;height:40px;border-radius:50%;padding:0;border:2px solid #fff3}
.peg{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid #ffffff33;margin:0 2px;box-shadow:inset 0 -3px 0 #0003}.peg.big{width:32px;height:32px}
.cbr{display:flex;align-items:center;gap:4px;padding:4px 0;border-bottom:1px solid #ffffff10}.cbr .fb{margin-left:auto;font-size:15px;letter-spacing:1px}.cbr .fb em{font-style:normal;color:var(--mut)}.cbr.cur{justify-content:center;padding:8px}.crow2{display:flex;justify-content:center;margin:8px 0}

/* build 39: Trivia Showdown look */
.tv{--cc:#a78bfa}
.tv-top{display:flex;align-items:stretch;gap:8px}
.tv-pl{flex:1;display:flex;align-items:center;gap:6px;background:#ffffff0d;border:2px solid var(--line);border-radius:14px;padding:6px 8px;font-weight:800;font-size:13px;position:relative;min-width:0}
.tv-pl.a{border-color:var(--a)}.tv-pl.b{border-color:var(--b);flex-direction:row-reverse}

function line4(b,W,H,need,idx){ /* returns winning cells or null */
  var D=[[1,0],[0,1],[1,1],[1,-1]];
  for(var r=0;r<H;r++)for(var cc=0;cc<W;cc++){var v=b[r*W+cc];if(!v)continue;
    for(var k=0;k<4;k++){var cells=[r*W+cc],x=cc,y=r;for(var n=1;n<need;n++){x+=D[k][0];y+=D[k][1];if(x<0||y<0||x>=W||y>=H||b[y*W+x]!==v)break;cells.push(y*W+x)}if(cells.length===need)return{who:v,cells:cells}}}
  return null}

var DCAT=[["1","Ones"],["2","Twos"],["3","Threes"],["4","Fours"],["5","Fives"],["6","Sixes"],["k3","3 of a kind"],["k4","4 of a kind"],["fh","Full house"],["ss","Small straight"],["ls","Large straight"],["y","Five of a kind!"],["ch","Chance"]];
function dScore(cat,d){var cnt=[0,0,0,0,0,0,0];d.forEach(function(v){cnt[v]++});var sum=d.reduce(function(a,b){return a+b},0),mx=Math.max.apply(null,cnt),u=cnt.join("");
  if(/^[1-6]$/.test(cat))return cnt[+cat]*(+cat);
  if(cat==="k3")return mx>=3?sum:0;if(cat==="k4")return mx>=4?sum:0;if(cat==="fh")return cnt.indexOf(3)>=0&&cnt.indexOf(2)>=0?25:0;
  var run=function(n){var s=0,best=0;for(var i=1;i<=6;i++){s=cnt[i]?s+1:0;best=Math.max(best,s)}return best>=n};
  if(cat==="ss")return run(4)?30:0;if(cat==="ls")return run(5)?40:0;if(cat==="y")return mx===5?50:0;return sum}
function dTotal(sc){var up=0,t=0;Object.keys(sc).forEach(function(k){t+=sc[k];if(/^[1-6]$/.test(k))up+=sc[k]});return t+(up>=63?35:0)}
var PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieHtml(v,cls,attr){var g="";for(var i=0;i<9;i++)g+='<i class="'+(PIPS[v]&&PIPS[v].indexOf(i)>=0?"on":"")+'"></i>';return'<button class="die '+(cls||"")+'" '+(attr||"")+'>'+g+"</button>"}

var CBC=["#ef4444","#f59e0b","#22c55e","#3b82f6","#a855f7","#f472b6"];
function cbFb(code,g){var b=0,w=0,cc=[],gg=[];for(var i=0;i<4;i++){if(code[i]===g[i])b++;else{cc.push(code[i]);gg.push(g[i])}}gg.forEach(function(x){var k=cc.indexOf(x);if(k>=0){w++;cc.splice(k,1)}});return[b,w]}

/* ======================= BUILD 33: play solo against a bot ======================= */
/* The bot plays slot "b" in a local-only game (no Sync needed). It renders the game into a hidden element
   as the bot and clicks the same buttons a person would, so every game rule and win check is reused. */
var BOTS={},SIMBOT={reaction:1,trivia:1,jeopardy:1};
function botKick(ms){if(!R||!R.local)return;clearTimeout(R.botT);R.botT=setTimeout(botStep,ms||(750+Math.random()*600))}
function botSeen(){ /* memory match: remember every card either side has flipped */
  if(!R||!R.local||R.doc.g!=="memory")return;var st=R.doc.st;R.mem=R.mem||{};
  (st.up||[]).forEach(function(i){R.mem[i]=st.o[i]});Object.keys(st.own||{}).forEach(function(i){delete R.mem[i]})}
function botStep(){
  if(!R||!R.local)return;var d=R.doc,G=GAMES[d.g],f=BOTS[d.g];
  if(!f||d.winner||d.turn!=="b"||G.sim)return;
  var c=ctx("b"),host=document.createElement("div");host.style.display="none";document.body.appendChild(host);
  var el=document.createElement("div");host.appendChild(el);var op=window.prompt;window.prompt=function(){return"Q"};
  try{G.render(el,c);f(el,c,G)}catch(e){console.error("bot",d.g,e)}
  window.prompt=op;setTimeout(function(){host.remove()},100)}
function botSimReply(o){
  var g=R.doc.g,st=R.doc.st,rep=null,delay=800;
  if(g==="reaction"){rep={k:o.k,ms:Math.random()<.04?99999:Math.round(240+Math.random()*230)};delay=500}
  else if(g==="trivia"){var q=st.qs[st.i],ok=Math.random()<.65;rep={k:o.k,a:ok?q.a:(q.a+1+Math.floor(Math.random()*3))%4,ms:Math.round(2500+Math.random()*7500)};delay=1100}
  else if(g==="jeopardy"&&st.cur){var jq=st.board[st.cur.c][st.cur.r],jok=Math.random()<(.82-st.cur.r*.09);rep={k:o.k,a:jok?jq.a:(jq.a+1+Math.floor(Math.random()*3))%4,ms:Math.round(2200+Math.random()*8000)};delay=1100}
  if(!rep)return;var code=R.code;
  setTimeout(function(){if(!R||!R.local||R.code!==code)return;R.sim=rep;render()},delay)}
var bk=function(el,sel){var x=el.querySelector(sel);if(x&&!x.disabled){if(x.click)x.click();else if(x.onclick)x.onclick({});return true}return false};
var bPick=function(a){return a[Math.floor(Math.random()*a.length)]};

/* Connect 4 */
BOTS.connect4=function(el,c){
  var W=7,H=6,me=c.me,op=c.opp;
  function drop(b,col,p){var nb=b.slice();for(var r=H-1;r>=0;r--)if(!nb[r*W+col]){nb[r*W+col]=p;return nb}return null}
