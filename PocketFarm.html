<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a5652e">
<title>Pocket Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff7e0;--paper2:#f6e4b8;--paper3:#ecd49b;--ink:#4a2f14;--mut:#8a6a3e;--gold:#ffc83d;--barn:#e0533a;--water:#3ba7e6;--grn:#5cb82e;
  --wood:#c98b4a;--wood2:#a5652e;--woodD:#6e3f17;--g1:#8fd16a;--g2:#7fc45a;--g3:#6fb24c;--sky:#bfe6f7;--soil:#8a5630;--soil2:#6a3f1f;--path:#e6c78f;--path2:#cfa868}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#4a3827;--paper2:#3b2c1d;--paper3:#5a4430;--ink:#fbecd0;--mut:#d6bf98}}
:root[data-theme="dark"]{--paper:#4a3827;--paper2:#3b2c1d;--paper3:#5a4430;--ink:#fbecd0;--mut:#d6bf98}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:800 14px/1.3 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--g1);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;height:100vh;height:100dvh}
body[data-th="autumn"]{--g1:#d8b45a;--g2:#cba24a;--g3:#b88c3a;--sky:#f5d9a8}
body[data-th="winter"]{--g1:#eef6fb;--g2:#dfeef7;--g3:#cfe2ef;--sky:#dcecf6}
body[data-th="blossom"]{--g1:#a8d878;--g2:#99cc6a;--g3:#f2b6cf;--sky:#fbe3ee}
body[data-th="sunset"]{--g1:#9bc05a;--g2:#8fb24e;--g3:#7f9f42;--sky:#ffc89a}
h2,h3,.f,.pill,.btn,.toast,.fl,.lb,.slot,#dk button,.ch,.qp,.tabs button,.bub b,.fbar button,.badge{font-family:Fredoka,'Trebuchet MS',sans-serif;font-weight:700}
h2{margin:0;font-size:21px}h3{margin:16px 0 6px;font-size:16px;color:var(--woodD)}
p{margin:6px 0}.mut{color:var(--mut);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:disabled{opacity:.5;pointer-events:none}
.wood{background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 11px),linear-gradient(#cf9455,#a8682f)}

/* ---------------- HUD ---------------- */
#hud{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;padding-top:calc(7px + env(safe-area-inset-top,0px));background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 11px),linear-gradient(#cf9455,#a8682f);border-bottom:4px solid var(--woodD);box-shadow:0 4px 0 #0003,inset 0 2px 0 #ffffff40;z-index:10;position:relative}
.ib{width:38px;height:38px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff8e6,#f2d9a2);border:3px solid var(--woodD);color:var(--ink);font-size:17px;display:grid;place-items:center;box-shadow:0 3px 0 #0004;text-decoration:none}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #0004}
.lvl{position:relative;display:flex;align-items:center;flex:1;min-width:0;max-width:440px;padding-left:16px}
.badge{position:absolute;left:0;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;font-size:16px;color:#6b3d00;z-index:2;
  background:radial-gradient(circle at 40% 30%,#fff4b0,#ffc83d 55%,#e69a12);clip-path:polygon(50% 0,61% 33%,97% 35%,68% 57%,79% 92%,50% 72%,21% 92%,32% 57%,3% 35%,39% 33%);filter:drop-shadow(0 2px 0 #0004)}
.badge span{position:relative;top:2px}
.xpb{flex:1;height:20px;margin-left:10px;background:#3b2210;border-radius:99px;overflow:hidden;border:3px solid var(--woodD);box-shadow:inset 0 2px 3px #0008;position:relative}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(#c6f57b,#5cb82e 60%,#3f9420);transition:width .4s;border-radius:99px;box-shadow:inset 0 2px 0 #ffffff60}
.xpb em{position:absolute;inset:0;display:grid;place-items:center;font:700 10px Fredoka;font-style:normal;color:#fff;text-shadow:0 1px 2px #000}
.pill{display:flex;align-items:center;gap:4px;background:#fff8e6;color:var(--ink);border:3px solid var(--woodD);border-radius:99px;padding:2px 9px 2px 4px;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 #0003,inset 0 -3px 0 #0001;min-width:58px}
.pill .ico{font-size:17px;filter:drop-shadow(0 1px 0 #0003)}
.ib.wxb{width:auto;min-width:38px;padding:0 8px;border-radius:99px;font-size:16px;white-space:nowrap}
.qp{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 auto;max-width:520px;width:calc(100% - 20px);padding:5px 6px 5px 12px;border-radius:0 0 16px 16px;background:var(--paper);color:var(--ink);font-size:13px;box-shadow:0 3px 0 #0003;border:3px solid var(--woodD);border-top:0;z-index:9;position:relative;cursor:pointer}
.qp b{background:var(--gold);color:#5a3a00;border-radius:99px;padding:1px 9px;border:2px solid #b37a00;font-family:Fredoka}

/* ---------------- MAP ---------------- */
#mapw{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;cursor:grab;background:linear-gradient(transparent 1080px,#b8b1a6 1080px 1090px,#5f636c 1090px 1180px,#b8b1a6 1180px 1190px,transparent 1190px) local,var(--g1)}
#map.panning{cursor:grabbing}
#map::-webkit-scrollbar{display:none}
#world{position:relative;width:600px;height:1240px;margin:0 auto;overflow:hidden}
#bg{position:absolute;left:0;top:0;width:600px;height:1240px;display:block}
#jmp{position:absolute;left:8px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:8}
#jmp .jl{display:none;flex-direction:column;gap:6px}
#jmp.on .jl{display:flex;animation:up .18s ease-out}
#jmp.on .jt{background:radial-gradient(circle at 40% 30%,#fff4b0,#ffc83d)}
#jmp button{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff8e6,#f2d9a2);border:3px solid var(--woodD);font-size:19px;box-shadow:0 3px 0 #0004}
#jmp button:active{transform:translateY(2px);box-shadow:0 1px 0 #0004}
svg.art{display:block;overflow:visible}
.shd{fill:#1f3d10;opacity:.2}
.win{fill:#bfe6f7;transition:fill 1.5s}
body.nt .win{fill:#ffd66b}
.blades{animation:spin 8s linear infinite}
.wheel{animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pf{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:smoke 3.6s ease-out infinite}
.pf:nth-child(2){animation-delay:1.2s}.pf:nth-child(3){animation-delay:2.4s}
@keyframes smoke{0%{opacity:.0;transform:translate(0,0) scale(.5)}15%{opacity:.8}100%{opacity:0;transform:translate(6px,-28px) scale(1.8)}}
.rip{fill:none;stroke:#fff;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:rip 4s ease-out infinite}
.rip:nth-of-type(2){animation-delay:1.3s}.rip:nth-of-type(3){animation-delay:2.6s}
@keyframes rip{0%{opacity:.7;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 1.4s ease-in-out infinite}
@keyframes flag{50%{transform:scaleX(.8) skewY(4deg)}}

/* buildings */
.bd{position:absolute;cursor:pointer;transition:transform .12s;transform-origin:50% 90%}
.bd:active{transform:scale(.95)}
.bd.lk .art{filter:grayscale(1) brightness(1.12) contrast(.8);opacity:.5}
.bd.lk::before{content:'';position:absolute;inset:8px 4px 10px;border:3px dashed #fff9;border-radius:18px}
.bd .lb{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:11px;background:var(--paper);color:var(--ink);border:2px solid var(--woodD);border-radius:9px;padding:1px 8px;white-space:nowrap;box-shadow:0 2px 0 #0003;z-index:3;pointer-events:none}
.bd.lk .lb{background:#fff3cf}
.bd .gl{position:absolute;left:50%;top:55%;width:170px;height:140px;margin:-70px 0 0 -85px;border-radius:50%;background:radial-gradient(rgba(255,214,120,.6),rgba(255,190,90,.22) 45%,transparent 68%);opacity:var(--lamp,0);pointer-events:none;z-index:4;mix-blend-mode:screen}
.bd.lk .gl{display:none}
.bub{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;white-space:nowrap}
.bub:empty{display:none}
.bub b{position:relative;display:inline-block;background:#fff;color:var(--ink);border-radius:14px;padding:2px 9px;font-size:14px;box-shadow:0 3px 0 #0003;border:3px solid var(--woodD)}
.bub b::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--woodD)}
.bub b.rdy{animation:bob 1s ease-in-out infinite;border-color:#3f9420;background:#f0ffe0}
.bub b.rdy::after{border-top-color:#3f9420}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes hop{0%,70%,100%{transform:none}80%{transform:translateY(-5px)}}
/* pens */
.pen .pa{position:absolute;left:14px;right:14px;top:30px;bottom:18px;pointer-events:none}
.ani{position:absolute;font-size:25px;line-height:1;transition:left 2.4s linear,top 2.4s linear;filter:drop-shadow(0 3px 0 #0003);z-index:2}
.ani span{display:inline-block;animation:hop 1.1s ease-in-out infinite}
.ani.flip span{scale:-1 1}
.ani i{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:13px;font-style:normal;animation:bob 1s ease-in-out infinite}
.ani .hat{position:absolute;left:6px;top:-9px;font-size:14px;font-style:normal;animation:none}
.ani i:empty{display:none}
body.nt .ani span{animation:none;opacity:.8}
body.nt .ani::after{content:'💤';position:absolute;right:-8px;top:-8px;font-size:11px}
/* field */
#fbar{position:absolute;left:12px;top:298px;display:flex;gap:6px;min-height:32px;z-index:5}
#fld{position:absolute;left:12px;top:342px;display:grid;grid-template-columns:repeat(4,60px);gap:6px;padding:11px;border-radius:20px;background:linear-gradient(#6a3f1f,#56331a);
  box-shadow:0 0 0 6px #c98b4a,0 0 0 9px var(--woodD),0 12px 0 6px #0002;transition:filter 3s;touch-action:pan-x pan-y;z-index:2}
#fld[data-fn="rope"]{box-shadow:0 0 0 6px #e8d39a,0 0 0 9px #a0864b,0 12px 0 6px #0002}
#fld[data-fn="stone"]{box-shadow:0 0 0 6px #b7bcc4,0 0 0 9px #6b717a,0 12px 0 6px #0002}
#fld[data-fn="gold"]{box-shadow:0 0 0 6px #ffd54f,0 0 0 9px #b37a00,0 0 18px 8px #ffd54f88,0 12px 0 6px #0002}
.plot{height:60px;border-radius:12px;position:relative;cursor:pointer;overflow:visible;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 3px,transparent 3px 12px),radial-gradient(circle at 40% 35%,#9a6236,#7b4a26);box-shadow:inset 0 3px 0 #ffffff1f,inset 0 -5px 0 #0003,0 2px 0 #0003}
#fld[data-pl="tilled"] .plot{background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 4px,transparent 4px 10px),radial-gradient(circle at 40% 35%,#9a6236,#7b4a26)}
#fld[data-pl="raised"] .plot{box-shadow:inset 0 3px 0 #ffffff1f,inset 0 -5px 0 #0003,0 0 0 3px #a8682f,0 5px 0 2px #6e3f17}
#fld[data-pl="moss"] .plot{background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 3px,transparent 3px 12px),radial-gradient(circle at 40% 35%,#7d8a44,#5d6b35)}
#fld[data-pl="clay"] .plot{background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 3px,transparent 3px 12px),radial-gradient(circle at 40% 35%,#cf7a4a,#a85a33)}
.plot.lk{background:radial-gradient(circle at 30% 30%,var(--g1),var(--g3));box-shadow:inset 0 -4px 0 #0002,0 2px 0 #0002}
.plot.ready{box-shadow:inset 0 3px 0 #ffffff1f,inset 0 -5px 0 #0003,0 0 0 3px #ffe27a,0 0 12px 2px #ffe27a99}
.plot .ob{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;filter:drop-shadow(0 3px 0 #0003)}
.plot .sp{position:absolute;inset:0;pointer-events:none}
.plot .cr{position:absolute;font-size:24px;line-height:1;filter:drop-shadow(0 2px 0 #0004);transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite;pointer-events:none}
.plot .cr:nth-child(2){animation-delay:-.8s}.plot .cr:nth-child(3){animation-delay:-1.6s}.plot .cr:nth-child(4){animation-delay:-.4s}
.plot.ready .cr{animation:sway 2.6s ease-in-out infinite,pop .35s ease-out}
@keyframes pop{from{scale:.3}}
.plot .bar{position:absolute;left:7px;right:7px;bottom:-4px;height:7px;background:#fff;border-radius:9px;overflow:hidden;border:2px solid var(--woodD);z-index:2}
.plot .bar i{display:block;height:100%;background:linear-gradient(#c6f57b,#5cb82e)}
.plot.hit{animation:plh .25s ease-out}
.plot.ready,#fld.brush .plot.e{touch-action:none}
.plot .cr.pk{left:20px;top:14px;font-size:17px;opacity:.95}
#fld.brush .plot.e::after{content:"";position:absolute;inset:12px;border-radius:50%;border:2px dashed #ffffff70;animation:bob 1.4s ease-in-out infinite}
@keyframes plh{40%{transform:scale(.9)}}
body.wet #fld{filter:brightness(.88) saturate(1.15)}
/* misc map objects */
.pond{position:absolute;cursor:pointer}
.pond .lb{bottom:-2px}
.dc{position:absolute;cursor:pointer}
.dc.off{display:grid;place-items:center;border-radius:50%;border:3px dashed #ffffffb0;background:#ffffff26;color:#fff;font:700 22px Fredoka;text-shadow:0 2px 0 #0003}
.dc.off:active{transform:scale(.94)}
#vs{position:absolute;width:100px;text-align:center;cursor:pointer;z-index:4}
#vs .who{font-size:40px;display:inline-block;animation:hop 1.6s ease-in-out infinite;filter:drop-shadow(0 3px 0 #0003)}
#vs b{display:block;font:700 11px Fredoka;background:#fff;color:var(--ink);border:2px solid var(--woodD);border-radius:99px;padding:1px 6px;box-shadow:0 2px 0 #0003;animation:bob 1.2s ease-in-out infinite;margin:0 10px}
.veh{position:absolute;left:0;z-index:7;pointer-events:none;will-change:transform}
.veh .vi{display:block}
.veh.l .vi{transform:scaleX(-1)}
.veh .hl{opacity:0;transition:opacity 2s}
body.nt .veh .hl{opacity:.9}
.cust{position:absolute;font-size:24px;z-index:6;pointer-events:none;line-height:1}
.cust span{display:inline-block;animation:hop .5s ease-in-out infinite}
.cust.r span{scale:-1 1}
#dtruck{position:absolute;z-index:5;pointer-events:none}
#dtruck .ti{width:100px;height:58px}
body.nt #dtruck .hl{opacity:.9}
.cl{position:absolute;pointer-events:none;opacity:.5;animation:cld 120s linear infinite;z-index:7}
@keyframes cld{from{transform:translateX(-160px)}to{transform:translateX(720px)}}
.cx{position:absolute;pointer-events:none;opacity:0;transition:opacity 4s;z-index:7;animation:cld 100s linear infinite;filter:brightness(var(--cb,1)) drop-shadow(0 40px 8px rgba(0,0,0,.16))}
#gw,#gs{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 3s;z-index:6}
#gw{background:#1c3b5a}#gs{background:#fff}
.bfly{position:absolute;left:300px;top:600px;pointer-events:none;z-index:7;font-size:16px;transition:left 3.4s ease-in-out,top 3.4s ease-in-out,opacity 1s}
.bfly span{display:inline-block;animation:flap .25s ease-in-out infinite alternate}
.bfly.r span{scale:-1 1}
@keyframes flap{to{transform:scaleX(.45) translateY(-2px)}}
body.nt .bfly,body.wet .bfly{opacity:0}
.bart{display:grid;place-items:center;margin:8px 0 4px}
.bart svg{max-width:100%;height:auto;max-height:130px}
.big.dart svg{width:44px;height:auto;max-height:44px}

/* ---------------- DOCK ---------------- */
#dk{display:flex;justify-content:center;background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 11px),linear-gradient(#cf9455,#a8682f);border-top:4px solid var(--woodD);box-shadow:0 -4px 0 #0003;z-index:10;padding:5px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#dk button{flex:1;max-width:84px;background:none;color:#fff;font-size:11px;position:relative;padding:0;text-shadow:0 1px 0 #0008,0 0 3px #0006}
#dk b{display:grid;place-items:center;margin:0 auto 2px;width:44px;height:44px;border-radius:50%;font-size:22px;background:radial-gradient(circle at 40% 30%,#fff8e6,#f2d9a2);border:3px solid var(--woodD);box-shadow:0 3px 0 #0004;text-shadow:none}
#dk button:active b{transform:translateY(2px);box-shadow:0 1px 0 #0004}
#dk u{position:absolute;top:-4px;right:14%;text-decoration:none;background:var(--barn);color:#fff;border-radius:99px;min-width:20px;padding:0 5px;font-size:11px;border:2px solid #fff;line-height:16px;text-shadow:none}
#dk u:empty{display:none}

/* ---------------- SHEETS & MODALS ---------------- */
.ov{position:fixed;inset:0;background:#1a0f0599;display:none;z-index:50}
.ov.on{display:block}
.ov.c.on{display:grid;place-items:center;padding:16px}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,480px);max-height:86vh;max-height:86dvh;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px #0006,inset 0 0 0 4px var(--woodD),inset 0 0 0 7px #c98b4a;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.modal{width:min(100%,370px);max-height:90vh;overflow:auto;background:var(--paper);border-radius:26px;padding:20px 18px;text-align:center;box-shadow:0 10px 40px #0008,inset 0 0 0 4px var(--woodD),inset 0 0 0 7px #c98b4a;animation:pp .28s cubic-bezier(.3,1.6,.6,1)}
@keyframes pp{from{transform:scale(.7);opacity:0}}
.sh-h{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:14px 4px 8px;z-index:2;margin:0 -4px;border-radius:24px 24px 0 0}
.sh-h h2{background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 11px),linear-gradient(#cf9455,#a8682f);color:#fff;text-shadow:0 2px 0 #0006;padding:5px 16px;border-radius:12px;border:3px solid var(--woodD);box-shadow:0 3px 0 #0003;font-size:18px}
.x{width:36px;height:36px;border-radius:50%;background:var(--barn);color:#fff;font-size:15px;border:3px solid #8e2a1c;box-shadow:0 3px 0 #0004}
.cd{background:var(--paper2);border-radius:16px;padding:10px;margin:8px 0;box-shadow:inset 0 -3px 0 #0001,0 0 0 2px #0000000d}
.rt{display:flex;align-items:center;gap:10px;justify-content:space-between}
.rt>div{flex:1}
.cd.rt>b{flex:1}
.big{font-size:32px;line-height:1;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--paper);box-shadow:inset 0 -3px 0 #0001;flex:none}
.em{font-size:56px;line-height:1.1;margin:4px 0;filter:drop-shadow(0 4px 0 #0002)}
.row2{display:flex;gap:8px;margin-top:8px}.row2 .btn{flex:1}
.btn{background:linear-gradient(#ffd75e,#f2b021);color:#4a2e00;border-radius:14px;padding:8px 13px;font-size:14px;box-shadow:0 4px 0 #b37a00,0 5px 4px #0002;border:2px solid #b37a00;text-shadow:0 1px 0 #ffffff80}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b37a00}
.btn.g{background:linear-gradient(#9be36a,#5cb82e);color:#123b00;border-color:#3a8a17;box-shadow:0 4px 0 #3a8a17,0 5px 4px #0002}
.btn.g:active{box-shadow:0 1px 0 #3a8a17}
.btn.r{background:linear-gradient(#ff8d70,#e0533a);color:#fff;border-color:#a8321d;box-shadow:0 4px 0 #a8321d,0 5px 4px #0002;text-shadow:0 1px 0 #0004}
.btn.b{background:linear-gradient(#8fd6ff,#3ba7e6);color:#06324d;border-color:#1f7ab3;box-shadow:0 4px 0 #1f7ab3,0 5px 4px #0002}
.btn.p{background:linear-gradient(#dcc4ff,#a77cf0);color:#2d0f5a;border-color:#7244c0;box-shadow:0 4px 0 #7244c0,0 5px 4px #0002}
.btn.wide{display:block;width:100%;margin:10px 0;padding:11px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{border-radius:16px;background:var(--paper2);min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;position:relative;padding:6px 4px;text-align:center;box-shadow:inset 0 -4px 0 #0001,0 0 0 2px #0000000f}
.slot span{font-size:31px;line-height:1.1;filter:drop-shadow(0 2px 0 #0002)}.slot sub{font-size:12px}
.slot small{font-size:12px}
button.slot:active{transform:scale(.95)}
.slot.rd{background:#d8f6bd;box-shadow:0 0 0 3px var(--grn),inset 0 -4px 0 #0001;color:#123b00;animation:bob 1.2s ease-in-out infinite}
.slot.em2{opacity:.55}
.slot.up{background:transparent;border:2px dashed var(--mut);box-shadow:none}
.slot .gm{position:absolute;right:3px;top:3px;background:#6cc2f0;color:#06324d;border-radius:99px;padding:1px 6px;font-size:11px;border:2px solid #1f7ab3}
.hat{position:absolute;top:-4px;font-style:normal;font-size:18px}
.ch{display:inline-block;background:var(--paper);border-radius:99px;padding:3px 10px;margin:3px 4px 2px 0;font-size:13px;box-shadow:inset 0 0 0 2px #0002}
.ch.no{box-shadow:inset 0 0 0 2px var(--barn);color:var(--barn)}
.rc.lk{opacity:.6}
.pr{height:14px;border-radius:99px;background:#0002;overflow:hidden;margin:8px 0;box-shadow:inset 0 2px 2px #0002}.pr i{display:block;height:100%;transition:width .1s;border-radius:99px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;background:var(--paper2);border-radius:12px;padding:9px;box-shadow:inset 0 -3px 0 #0001}.tabs button.on{background:linear-gradient(#ffd75e,#f2b021);color:#4a2e00;box-shadow:0 3px 0 #b37a00}
.lnk{background:none;color:var(--mut);text-decoration:underline;padding:8px 0}
.stp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.stp b{font:700 21px Fredoka;min-width:90px;text-align:center}.stp .btn{width:46px;padding:8px 0}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.tg button{background:#0003;border-radius:99px;width:52px;height:28px;position:relative}.tg button:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px #0004}.tg button.on{background:#7ccf55}.tg button.on:after{left:27px}
.dr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0;font-size:11px}
.dr div{background:var(--paper2);border-radius:10px;padding:6px 0;font-family:Fredoka}.dr .on{background:linear-gradient(#ffd75e,#f2b021);color:#4a2e00;box-shadow:0 0 0 2px #b37a00}.dr .dn{opacity:.5}
.hg,.mg{display:grid;gap:8px;margin:10px 0}.hg{grid-template-columns:repeat(3,1fr)}.mg{grid-template-columns:repeat(4,1fr)}
.hole,.mc{aspect-ratio:1;border-radius:16px;background:radial-gradient(circle at 50% 60%,#5a3a1a 0 34%,#8a5630 36%,var(--paper3) 38%);font-size:34px;box-shadow:inset 0 -5px 0 #0003}
.mc{background:linear-gradient(#cf9455,#a8682f);color:#fff;font-family:Fredoka;box-shadow:0 4px 0 var(--woodD)}
.mc.up{background:#d8f6bd;box-shadow:0 0 0 3px var(--grn)}
.padd{position:relative;height:140px;border-radius:18px;background:radial-gradient(circle at 30% 30%,var(--g1),var(--g3));box-shadow:inset 0 0 0 5px #c98b4a,inset 0 0 0 8px var(--woodD),inset 0 -8px 0 #0002;overflow:hidden;margin:8px 0}
.an{position:absolute;font-size:36px;line-height:1;cursor:pointer;transition:left 2.4s linear,top 2.4s linear;filter:drop-shadow(0 3px 0 #0003);padding:4px;background:none}
.an span{display:inline-block;animation:hop 1.1s ease-in-out infinite}.an.flip span{scale:-1 1}
.an i{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:13px;font-style:normal;background:#fff;border:2px solid var(--woodD);border-radius:99px;padding:1px 6px;box-shadow:0 2px 0 #0003;white-space:nowrap;font-family:Fredoka,sans-serif;font-weight:700;color:#42301d}
.an i.rdy{animation:bob .9s ease-in-out infinite;border-color:#3f9420}
.an .hat{left:12px;top:-8px}
.trk{position:relative;height:36px;background:#0002;border-radius:12px;margin:12px 0;overflow:hidden}.zone{position:absolute;left:40%;width:30%;top:0;bottom:0;background:#3ba7e655;border-inline:3px dashed var(--water)}.hd{position:absolute;top:3px;left:0;width:12px;height:30px;border-radius:5px;background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
.shp{position:relative;height:150px;border-radius:16px;background:radial-gradient(circle at 30% 30%,var(--g1),var(--g3));display:grid;place-items:center;font-size:66px;touch-action:none;overflow:hidden;cursor:crosshair;margin:10px 0}
.puff{position:absolute;font-size:30px;pointer-events:none;animation:fallp 1.2s ease-out forwards}@keyframes fallp{to{transform:translateY(70px) scale(1.3);opacity:0}}
.tl{position:relative;height:14px;border-radius:99px;margin:12px 0 6px;background:linear-gradient(90deg,#1b2a5e 0%,#1b2a5e 20%,#ffb27a 27%,#8fd6ff 36%,#8fd6ff 70%,#ff8f5a 77%,#1b2a5e 87%,#1b2a5e 100%)}
.tl i{position:absolute;top:-4px;width:6px;height:22px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px #0006}

/* ---------------- FX ---------------- */
#toasts{position:fixed;top:calc(96px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:70}
.toast{background:var(--paper);color:var(--ink);border:3px solid var(--woodD);border-radius:99px;padding:6px 15px;font-size:14px;animation:tt .3s cubic-bezier(.3,1.6,.6,1);max-width:90%;text-align:center;box-shadow:0 4px 0 #0003}
@keyframes tt{from{transform:translateY(-14px) scale(.8);opacity:0}}
.fl{position:fixed;z-index:80;pointer-events:none;color:#fff;font-size:18px;text-shadow:0 2px 0 #000a,0 0 6px #000;animation:fl 1.1s ease-out forwards;transform:translateX(-50%);white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-56px);opacity:0}}
.fly{position:fixed;z-index:80;pointer-events:none;font-size:28px}
.pt{position:fixed;top:-20px;pointer-events:none;z-index:4;animation:pf linear forwards}
@keyframes pf{to{transform:translateY(110vh) rotate(360deg)}}
.bug{position:fixed;z-index:60;font-size:30px;cursor:pointer;animation:bugf 7s linear forwards}
@keyframes bugf{to{transform:translate(70vw,-30px)}}
/* sky, day/night and weather */
#tint{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;background:#fff;transition:background 1.2s linear;z-index:5}
#wxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#fog{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity 3s,filter 3s;background:radial-gradient(60% 38% at 18% 28%,rgba(255,255,255,.7),transparent 72%),radial-gradient(70% 44% at 82% 58%,rgba(255,255,255,.65),transparent 72%),radial-gradient(64% 40% at 38% 92%,rgba(255,255,255,.65),transparent 72%),rgba(232,238,244,.3);background-size:150% 150%;animation:fogm 38s ease-in-out infinite alternate}
@keyframes fogm{from{background-position:0 0}to{background-position:100% 60%}}
#bolt{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#bolt.go{animation:bolt .55s ease-out}
@keyframes bolt{0%{opacity:.85}10%{opacity:.08}20%{opacity:.7}100%{opacity:0}}
#hz{position:absolute;left:0;right:0;top:0;height:42%;z-index:6;pointer-events:none;transition:opacity 2s}
#stars{position:absolute;left:0;right:0;top:0;height:60%;z-index:6;pointer-events:none;opacity:0;transition:opacity 2.5s;-webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
#stars .st{position:absolute;inset:0;animation:tw 3.2s ease-in-out infinite alternate}
#stars .st2{animation-duration:4.7s;animation-delay:-1.5s}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.orb{position:absolute;z-index:6;pointer-events:none;font-size:34px;line-height:1;margin:-17px 0 0 -17px;opacity:0;transition:left 1.2s linear,top 1.2s linear,opacity 1.5s}
#sun{filter:drop-shadow(0 0 14px rgba(255,214,110,.95))}
#moon{filter:drop-shadow(0 0 12px rgba(200,220,255,.9))}
#rbw{position:absolute;left:50%;top:6px;width:460px;max-width:100%;height:235px;transform:translateX(-50%);z-index:6;pointer-events:none;opacity:0;transition:opacity 3s;background:radial-gradient(circle 230px at 50% 100%,transparent 0 62%,rgba(255,60,60,.5) 64%,rgba(255,160,40,.5) 68%,rgba(255,235,60,.5) 72%,rgba(80,200,90,.5) 76%,rgba(60,150,255,.5) 80%,rgba(150,90,230,.5) 84%,transparent 87%);-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
body.nt .bd .ar span{animation:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

<script>
/* =====================================================================
   POCKET FARM · art (inline SVG, drawn in code)
   ===================================================================== */
const ART = (() => {
'use strict';
const OL = '#5a3517';
const svg = (w, h, body, cls = '') => `<svg class="art ${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${body}</svg>`;
const shd = (cx, cy, rx, ry) => `<ellipse class="shd" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry || rx * .16}"/>`;
const win = (x, y, w = 16, h = 14) => `<rect class="win" x="${x}" y="${y}" width="${w}" height="${h}" rx="2.5" stroke="${OL}" stroke-width="2"/><path d="M${x + w / 2} ${y}v${h}M${x} ${y + h / 2}h${w}" stroke="${OL}" stroke-width="1.4"/><rect x="${x - 2}" y="${y + h - 1}" width="${w + 4}" height="4" rx="1.5" fill="#fff6e6" stroke="${OL}" stroke-width="1.5"/>`;
const smoke = (x, y) => `<g><circle class="pf" cx="${x}" cy="${y}" r="5"/><circle class="pf" cx="${x}" cy="${y}" r="5"/><circle class="pf" cx="${x}" cy="${y}" r="5"/></g>`;
const chimney = (x, y, h = 22) => `<rect x="${x}" y="${y}" width="12" height="${h}" fill="#a0704c" stroke="${OL}" stroke-width="2"/><rect x="${x - 2}" y="${y - 3}" width="16" height="6" rx="1.5" fill="#7a5238" stroke="${OL}" stroke-width="2"/>${smoke(x + 6, y - 6)}`;
const sign = (x, y, e, w = 30) => `<rect x="${x - w / 2}" y="${y - 9}" width="${w}" height="17" rx="5" fill="#f8e7bd" stroke="${OL}" stroke-width="2"/><text x="${x}" y="${y + 4.5}" font-size="12" text-anchor="middle">${e}</text>`;
const bale = (x, y) => `<rect x="${x}" y="${y}" width="18" height="12" rx="3" fill="#f2c94c" stroke="#a87f1c" stroke-width="1.6"/><path d="M${x + 6} ${y}v12M${x + 12} ${y}v12" stroke="#c99a26" stroke-width="1.2"/>`;
const flowers = (x, y, c = '#ff6b8b') => `<rect x="${x}" y="${y}" width="18" height="6" rx="2" fill="#8d5525" stroke="${OL}" stroke-width="1.5"/><circle cx="${x + 4}" cy="${y - 1}" r="3" fill="${c}"/><circle cx="${x + 9}" cy="${y - 2}" r="3" fill="#ffd54f"/><circle cx="${x + 14}" cy="${y - 1}" r="3" fill="${c}"/>`;

// generic cottage for the production buildings
function cottage(o) {
    const {wall, roof, roofD, sign: sg, door = '#8a5a35', extraBack = '', extra = '', awning = null, chim = false} = o;
    let s = shd(54, 107, 50, 6) + extraBack;
    if(chim) s += chimney(70, 16, 24);
    s += `<rect x="12" y="46" width="84" height="58" rx="3" fill="${wall}" stroke="${OL}" stroke-width="2.5"/>`;
    s += `<rect x="13.5" y="47" width="81" height="9" fill="#000" opacity=".08"/>`;
    s += `<rect x="9" y="99" width="90" height="8" rx="2.5" fill="#b3aa9e" stroke="${OL}" stroke-width="2"/><path d="M20 103h6M40 103h8M64 103h6M84 103h6" stroke="#8c8378" stroke-width="1.4"/>`;
    s += `<path d="M3 50 L54 13 L105 50 Q104 54 100 54 L54 22 L8 54 Q4 54 3 50 Z" fill="${roofD}" stroke="${OL}" stroke-width="2.2" stroke-linejoin="round"/>`;
    s += `<path d="M8 49 L54 16 L100 49 Z" fill="${roof}" stroke="${OL}" stroke-width="2.2" stroke-linejoin="round"/>`;
    s += `<path d="M24 39 L54 18 L84 39 M36 31h36" stroke="${roofD}" stroke-width="2" fill="none" opacity=".55"/>`;
    s += `<circle cx="54" cy="36" r="6" class="win" stroke="${OL}" stroke-width="2"/>`;
    s += win(19, 64) + win(73, 64);
    if(awning) s += [19, 73].map(x => `<path d="M${x - 4} 62 h24 l-3 -8 h-18 z" fill="${awning[0]}" stroke="${OL}" stroke-width="1.6"/><path d="M${x + 2} 54 l-1 8 M${x + 8} 54 v8 M${x + 14} 54 l1 8" stroke="${awning[1]}" stroke-width="3"/>`).join('');
    s += `<path d="M44 100 V78 Q54 66 64 78 V100 Z" fill="${door}" stroke="${OL}" stroke-width="2.2"/><circle cx="60" cy="88" r="1.7" fill="#ffd54f"/><path d="M54 70v30" stroke="${OL}" stroke-width="1" opacity=".35"/>`;
    if(sg) s += sign(54, 57, sg);
    s += extra;
    return svg(108, 112, s);
}

const B = {};
B.barn = () => {
    let s = shd(60, 110, 58, 7);
    s += `<path d="M12 56 L60 26 L108 56 V104 H12 Z" fill="url(#gRed)" stroke="${OL}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s += `<path d="M26 48V104M40 39V104M54 31V104M66 31V104M80 39V104M94 48V104" stroke="#a8321d" stroke-width="1.4" opacity=".75"/>`;
    s += `<path d="M2 60 L19 37 L60 11 L101 37 L118 60 L108 64 L95 43 L60 21 L25 43 L12 64 Z" fill="#8e2f1f" stroke="${OL}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s += `<path d="M19 41 L60 16 L101 41" stroke="#c4553e" stroke-width="2.4" fill="none"/>`;
    s += `<rect x="49" y="38" width="22" height="18" rx="2" fill="#fff6e6" stroke="${OL}" stroke-width="2"/><rect x="52" y="41" width="16" height="12" fill="#5a2a14"/><path d="M53 53 q3.5 -6 7 0 q3.5 -6 7 0" fill="#f2c94c"/>`;
    s += `<path d="M12 56V104M108 56V104" stroke="#fff6e6" stroke-width="3.5"/>`;
    s += `<rect x="36" y="64" width="48" height="40" fill="#b8371f" stroke="#fff6e6" stroke-width="3.5"/><path d="M38 66L58 102M58 66L38 102M62 66L82 102M82 66L62 102" stroke="#fff6e6" stroke-width="3"/><path d="M60 64V104" stroke="#fff6e6" stroke-width="2.5"/>`;
    s += `<rect x="8" y="102" width="104" height="6" rx="2" fill="#a59c90" stroke="${OL}" stroke-width="2"/>`;
    s += bale(-2, 92) + bale(102, 92) + bale(106, 80);
    return svg(120, 116, s);
};
B.silo = () => {
    let s = shd(32, 124, 30, 5);
    s += `<rect x="8" y="34" width="48" height="88" rx="4" fill="url(#gSilo)" stroke="${OL}" stroke-width="2.5"/>`;
    s += `<path d="M8 56H56M8 78H56M8 100H56" stroke="#7d8a97" stroke-width="2"/>`;
    s += `<path d="M44 38V120M51 38V120" stroke="#6b5442" stroke-width="1.6"/><path d="M44 46h7M44 54h7M44 62h7M44 70h7M44 78h7M44 86h7M44 94h7M44 102h7M44 110h7" stroke="#6b5442" stroke-width="1.3"/>`;
    s += `<path d="M5 36 Q32 -6 59 36 Z" fill="url(#gDome)" stroke="${OL}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s += `<path d="M14 26 Q32 6 50 26" stroke="#fff" opacity=".45" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    s += `<rect x="4" y="32" width="56" height="7" rx="3.5" fill="#c9452e" stroke="${OL}" stroke-width="2"/>`;
    s += `<rect x="16" y="98" width="17" height="24" rx="2" fill="#8a5a35" stroke="${OL}" stroke-width="2"/><circle cx="29" cy="111" r="1.5" fill="#ffd54f"/>`;
    s += `<text x="23" y="80" font-size="14" text-anchor="middle">🌾</text>`;
    return svg(64, 128, s);
};
B.house = () => {
    let s = shd(70, 120, 64, 7);
    s += chimney(98, 14, 30);
    s += `<rect x="14" y="54" width="112" height="58" rx="3" fill="#fff3d6" stroke="${OL}" stroke-width="2.5"/>`;
    s += `<path d="M14 64h112M14 76h112M14 88h112M14 100h112" stroke="#e8d6b0" stroke-width="1.6"/>`;
    s += `<path d="M2 60 L36 20 H104 L138 60 Z" fill="#3b7fd0" stroke="${OL}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s += `<path d="M16 50 H124 M26 38 H114 M34 28 H106" stroke="#2c62a6" stroke-width="2" opacity=".7"/>`;
    s += `<path d="M56 46 L70 30 L84 46 Z" fill="#fff3d6" stroke="${OL}" stroke-width="2"/><rect class="win" x="64" y="38" width="12" height="9" stroke="${OL}" stroke-width="1.6"/>`;
    s += `<rect x="40" y="78" width="60" height="5" fill="#c98b4a" stroke="${OL}" stroke-width="1.6"/><path d="M44 83V110M96 83V110" stroke="#fff" stroke-width="4"/><path d="M44 83V110M96 83V110" stroke="${OL}" stroke-width="1" opacity=".4"/>`;
    s += `<path d="M38 74 L70 64 L102 74 Z" fill="#e0533a" stroke="${OL}" stroke-width="2"/>`;
    s += `<rect x="61" y="86" width="18" height="24" rx="3" fill="#6fae3a" stroke="${OL}" stroke-width="2"/><circle cx="75" cy="99" r="1.6" fill="#ffd54f"/>`;
    s += win(20, 82, 16, 16) + win(104, 82, 16, 16);
    s += flowers(19, 100) + flowers(103, 100, '#b388ff');
    s += `<rect x="10" y="108" width="120" height="6" rx="2" fill="#b3aa9e" stroke="${OL}" stroke-width="2"/>`;
    s += `<path d="M62 114 h16 l4 8 h-24 z" fill="#d8bf8f" stroke="${OL}" stroke-width="1.5"/>`;
    return svg(140, 124, s);
};

 const row=(k,e,n,d)=>`<div class="cd rt"><span class="big">${e}</span><div><b>${n}</b><br><small>${d}</small></div><button class="btn g" data-a="game" data-k="${k}" ${k!='spin'&&cd(k)?'disabled':''}>${k=='spin'?(free?'Free':'🪙50'):cd(k)?'<span data-e="'+G.cd[k]+'">'+fmt(G.cd[k]-t)+'</span>':'Play'}</button></div>`;

function avail(){const a=CR.filter(c=>c[3]<=G.lv).map(c=>c[0]);PENS.forEach(p=>G.bt[p]&&a.push(AN[p].prod));RC.forEach(r=>{if(r[3]!='feedmill'&&r[4]<=G.lv&&G.bt[r[3]])a.push(r[0])});return a}
function mkOrder(vip){const a=avail().sort(()=>R()-.5),L=G.lv,ln=vip?3:(L<3?1:1+rnd(3)),need={};let v=0,qty=0;
 a.slice(0,Math.min(ln,a.length)).forEach(id=>{const q=I[id].k=='c'?Math.min(8,2+rnd(3+(L/3|0))):1+rnd(2+(L/4|0));need[id]=q;v+=I[id].b*q;qty+=q});
 const m=vip?2:1;return {need,who:WHO[rnd(WHO.length)],coins:Math.round(v*1.25*m)+10,xp:Math.round((2+qty*1.4+L)*m),gem:vip?1+rnd(2):(R()<.12?1:0)}}
function ensureOrd(){const t=now();for(let i=0;i<ordSlots();i++){const o=G.ord[i];if(!o||(!o.need&&o.wait<=t))G.ord[i]=mkOrder()}}
function visTick(t){if(G.vis&&t>G.vis.exp)G.vis=null;if(!G.vis&&G.lv>=2&&t>=G.visNext){G.vis=Object.assign(mkOrder(true),{em:['👵','🧑‍🍳','🧙','👨‍🚀','🤠','🧑‍🎨'][rnd(6)],exp:t+du(900)});G.visNext=t+du(240);toast(G.vis.em+' A visitor arrived in town!')}}

const fairP=(id,n)=>I[id].b*n;
function custTick(t,live){if(!G.bt.shop)return 0;const iv=du(20)*shopMul();if(!G.shopNext)G.shopNext=t+iv;let bought=0,g=0;
 while(G.shopNext<=t&&g++<60){G.shopNext+=iv*(.6+R()*.9);const L=G.shop.map((s,i)=>s&&!s.sold?i:-1).filter(i=>i>=0);if(!L.length)continue;const i=L[rnd(L.length)],s=G.shop[i],r=s.p/fairP(s.id,s.n),pr=r<=1?.95:r<=1.3?.75:r<=1.7?.4:.15;
  if(R()<pr){s.sold=1;bought++;if(live){toast(`🧑 A customer bought ${I[s.id].e}×${s.n}`);walk();snd('coin')}}}
 if(G.shopNext<t)G.shopNext=t+iv;return bought}
// a shopper walks from the path to the stall and back (walking emoji face left, so mirror them on the way back)
function walk(){if(REDUCE)return;const w0=$('world'),d=document.createElement('div');d.className='cust';d.innerHTML=`<span>${['🚶','🚶‍♀️','🚶‍♂️','🚶'][rnd(4)]}</span>`;d.style.left='0px';d.style.top='992px';w0.appendChild(d);
 try{const a=d.animate([{transform:'translateX(286px)'},{transform:'translateX(78px)'}],{duration:1900,fill:'forwards'});
  a.onfinish=()=>setTimeout(()=>{d.classList.add('r');const b=d.animate([{transform:'translateX(78px)'},{transform:'translateX(286px)'}],{duration:1900,fill:'forwards'});a.cancel();b.onfinish=()=>d.remove()},800)}catch(e){d.remove()}
 setTimeout(()=>d.remove(),7000)}

let GT=[],GM=null;const later=(f,ms)=>{const i=setTimeout(f,ms);GT.push(i);return i},every=(f,ms)=>{const i=setInterval(f,ms);GT.push(i);return i};

function lures(){const L=G.lure,t=now(),iv=du(45);if(L.n>=5){L.ts=t;return 5}const g=fl((t-L.ts)/iv);if(g>0){L.n=Math.min(5,L.n+g);L.ts=L.n>=5?t:L.ts+g*iv}return L.n}

fish:{t:'🎣 Fishing Pond',h:()=>`<p class="mut" id="ft">Cast your line! 🪱 ${lures()}/5 lures</p><div class="em" id="fe">🌊</div><button class="btn b wide" id="fb" data-a="go">Cast line</button><p class="mut">A lure comes back every 45 seconds.${fishNote()}</p>`,
 i:()=>{let fs='idle';const say=(t,e,b)=>{$('ft').textContent=t;$('fe').textContent=e;$('fb').textContent=b};
  GM=()=>{if(fs=='idle'){if(lures()<1){say('Out of lures. One comes back soon.','😴','Cast line');return}lures();G.lure.n--;fs='wait';say(`Waiting for a bite… 🪱 ${lures()}/5`,'🎣','Wait…');later(()=>{fs='bite';say('Fish on! Hook it now!','🐟','Hook!');snd('pop');later(()=>{if(fs=='bite'){fs='idle';say('It got away. Cast again.','🌊','Cast line')}},1500)},(1500+R()*2500)*fishMul())}

   else{fs='idle';if(give('fish',1)){addXp(3);inc('fish');say('Caught a fish! 🏆','🐟','Cast again');snd('coin')}else say('Barn is full!','📦','Cast again');upd()}}}},
whack:{t:'🐹 Gopher Whack',h:()=>`<p class="mut"><b id="ws">0</b> caught · <b id="wt">20</b>s left</p><div class="hg">${'<button class="hole"></button>'.repeat(9)}</div>`,
 i:()=>{let sc=0,tl=20,up=-1;const hs=[...document.querySelectorAll('.hole')];hs.forEach((h,i)=>h.onpointerdown=()=>{if(i!=up)return;up=-1;h.textContent='💥';sc++;$('ws').textContent=sc;snd('tap');later(()=>h.textContent='',250)});

  every(()=>{tl--;$('wt').textContent=tl;if(tl<=0){G.cd.whack=now()+du(120);fin(`🐹 ${sc} gophers!`,sc*3+G.lv*2,sc)}},1000)}},
match:{t:'🃏 Crop Match',h:()=>`<p class="mut">Moves: <b id="mv">0</b></p><div class="mg">${'<button class="mc">?</button>'.repeat(12)}</div>`,
 i:()=>{const e=['🥕','🍅','🍓','🌶️','🍋','🎃'],d=e.concat(e).sort(()=>R()-.5);let a=-1,lock=0,m=0,mv=0;const cs=[...document.querySelectorAll('.mc')];
  cs.forEach((b,i)=>b.onclick=()=>{if(lock||b.classList.contains('up'))return;b.textContent=d[i];b.classList.add('up');snd('tap');if(a<0){a=i;return}mv++;$('mv').textContent=mv;const j=a;a=-1;
   if(d[i]==d[j]){m++;snd('coin');if(m==6)later(()=>{G.cd.match=now()+du(120);fin('🃏 All matched!',Math.max(10,70-mv*4),12)},500)}

spin:{t:'🎰 Lucky Spin',h:()=>`<p class="mut">${freeSpin()?'Your daily spin is free!':'Extra spins cost 🪙50'}</p><div class="em" id="rl">❔❔❔</div><button class="btn g wide" id="sb" data-a="go">${freeSpin()?'Spin free':'Spin · 🪙50'}</button>`,
 i:()=>{let busy=0;GM=()=>{if(busy)return;if(!freeSpin()){if(G.coins<50){toast('Need 🪙50',1);return}G.coins-=50}else G.spin=String(dayN());busy=1;$('sb').disabled=true;const S=['🪙','💎','⭐','🍀','🍎'];let n=0;every(()=>{$('rl').textContent=[0,1,2].map(()=>S[rnd(5)]).join('');snd('tap');if(++n>14){stopGame();const w=R(),r=w<.5?['🪙',60+rnd(60),0]:w<.8?['⭐',0,0,40]:w<.95?['🍀',150+rnd(100),0]:['💎',0,3];$('rl').textContent=r[0].repeat(3);G.coins+=r[1];G.gems+=r[2];if(r[3])addXp(r[3]);inc('games');snd('lvl');upd();later(()=>{closeS();toast(`🎰 ${r[1]?'+🪙'+r[1]:''} ${r[2]?'+💎'+r[2]:''} ${r[3]?'+⭐'+r[3]+' XP':''}`)},900)}},110)}}}};

ACT.dk=k=>{if(k=='shop'||k=='truck'||k=='nb')ACT.bld(k);else if(k=='sto')open('sto',{tab:'s'});else if(k=='dec')open('dec');else open('prof')};
ACT.bld=k=>{if(!G.bt[k])return open('build',{k});if(PROD.includes(k))open('bld',{k});else if(PENS.includes(k))open('pen',{k});else({barn:()=>open('sto',{tab:'b'}),silo:()=>open('sto',{tab:'s'}),nb:()=>open('nb'),fair:()=>open('fair'),shop:()=>open('shop'),truck:()=>open('truck')})[k]()};
ACT.build=k=>{const B=BL[k];if(G.lv<B[4]||G.coins<B[5])return;G.coins-=B[5];G.bt[k]=1;ensureAn();refreshB();closeS();snd('lvl');toast(`${B[1]} ${B[0]} built!`);upd()};
// fields
ACT.plot=(k,e)=>{if(FH){FH=0;return}const i=+k,p=G.pl[i];if(!p.s)return open('clear',{i});if(p.s==1){if(!BR)return open('seeds',{i});plantAt(i,BR,e)}else if(p.s==3){if(harvestAt(i,e)){drawPlot(i);bump(i)}upd()}else{bump(i);toast(`${I[p.c].e} ready in ${fmt(p.e-now())}`)}};
ACT.seeds=()=>open('seeds',{i:null});
ACT.seed=(k,e)=>{BR=k;const i=S.cur&&S.cur.i;closeS();if(i!=null)plantAt(i,k,e);fbar()};
ACT.brush=()=>{BR=null;fbar()};
ACT.pall=()=>{if(!BR)return;let n=0;G.pl.forEach((p,i)=>{if(p.s==1&&G.coins>=I[BR].c&&plantAt(i,BR))n++});if(!n)toast('No empty plots or not enough coins',1)};
ACT.hall=(k,e)=>{let n=0;for(let i=0;i<G.pl.length;i++){if(G.pl[i].s==3){if(harvestAt(i,null,n>0)){n++;drawPlot(i);bump(i)}else{if(!n)toast('Silo is full. Sell crops or upgrade it.',1);break}}}if(n&&e)fly('🧺',e.clientX,e.clientY);upd();fbar()};
ACT.clr=k=>{const c=clearCost();if(G.coins<c)return;G.coins-=c;G.pl[+k].s=1;inc('clear');closeS();drawPlot(+k);bump(+k);snd('coin');upd()};
// production
ACT.make=k=>{const[b,rid]=k.split(':'),q=Q(b),r=RCI[rid];if(q.it.length>=q.s||G.lv<r[4]||!needOk(r[6]))return;Object.entries(r[6]).forEach(([a,n])=>take(a,n));const t=now(),start=Math.max(t,...q.it.map(x=>x.end));q.it.push({r:rid,end:start+du(r[5])});snd('tap');vib();refresh()};
ACT.qc=(k,e)=>{const[b,i]=k.split(':'),q=Q(b),it=q.it[+i];if(!it||it.end>now()||!give(it.r,1))return;q.it.splice(+i,1);inc('made');inc('m_'+it.r);if(e)fly(I[it.r].e,e.clientX,e.clientY);snd('coin');addXp(RCI[it.r][8]);refresh()};
ACT.qca=(k,e)=>{const q=Q(k);let n=0;for(let i=0;i<q.it.length;){if(q.it[i].end<=now()&&give(q.it[i].r,1,n>0)){const it=q.it.splice(i,1)[0];inc('made');inc('m_'+it.r);addXp(RCI[it.r][8]);n++}else i++}if(n)snd('coin');refresh()};
ACT.qs=k=>{const[b,i]=k.split(':'),q=Q(b),t=now(),it=q.it[+i],rem=it.end-t,c=gcost(rem);if(G.gems<c)return toast('Not enough 💎',1);G.gems-=c;for(let j=+i;j<q.it.length;j++)q.it[j].end=Math.max(t,q.it[j].end-rem);snd('pop');refresh()};
ACT.qu=k=>{const q=Q(k),c=SU[q.s];if(!c||G.coins<c)return toast('Not enough coins',1);G.coins-=c;q.s++;snd('coin');refresh()};
// animals
ACT.an=(k,e)=>{const[p,i]=k.split(':'),a=G.an[p][+i],A=AN[p],t=now();
 if(!a.f){if(!has(A.feed,1))return toast(`Need ${I[A.feed].e} ${I[A.feed].n}. Make it at the Feed Mill.`,1);take(A.feed,1);a.f=1;a.e=t+du(A.t);inc('fed');addXp(1);snd('tap')}
 else if(t>=a.e){if(!give(A.prod,1))return;a.f=0;a.e=0;inc('coll');if(e)fly(I[A.prod].e,e.clientX,e.clientY);snd('coin');addXp(2)}
 else toast('Still working on it…');refresh();penTick(now())};
ACT.afeed=p=>{const A=AN[p];let n=0;G.an[p].forEach(a=>{if(!a.f&&has(A.feed,1)){take(A.feed,1);a.f=1;a.e=now()+du(A.t);inc('fed');n++}});if(!n)toast(`No hungry animals or no ${I[A.feed].n}`,1);else{addXp(n);snd('tap')}refresh()};
ACT.acoll=p=>{const A=AN[p];let n=0;G.an[p].forEach(a=>{if(a.f&&now()>=a.e&&give(A.prod,1,n>0)){a.f=0;a.e=0;inc('coll');n++}});if(n){addXp(2*n);snd('coin')}refresh()};
ACT.abuy=p=>{const A=AN[p],n=G.an[p].length,c=A.cost*(n-A.own+1);if(n>=A.max||G.coins<c)return;G.coins-=c;G.an[p].push({f:0,e:0});snd('coin');drawPen(p);refresh()};
// storage
ACT.stab=k=>{S.cur.tab=k;paint()};
ACT.sell1=id=>{if(!has(id,1))return;take(id,1);G.coins+=qv(id);snd('coin');refresh()};
ACT.sellall=id=>{const n=G.inv[id]||0;if(!n)return;G.coins+=n*qv(id);take(id,n);snd('coin');refresh()};
ACT.supg=k=>{const l=k=='s'?G.sl:G.bl,c=upc(k);if(l>=6||G.coins<c)return toast('Not enough coins',1);G.coins-=c;k=='s'?G.sl++:G.bl++;inc('upg');snd('lvl');refresh()};
// shop
ACT.sadd=k=>open('sadd',{i:+k,id:null,n:1,p:0});
ACT.shopb=()=>open('shop');
ACT.spick=id=>{const c=S.cur;c.id=id;c.n=Math.min(G.inv[id],3);c.p=fairP(id,c.n);paint()};
ACT.sq=k=>{const c=S.cur;c.n=clamp(c.n+ +k,1,G.inv[c.id]);c.p=fairP(c.id,c.n);paint()};
ACT.sp=k=>{const c=S.cur,fp=fairP(c.id,c.n),st=Math.max(1,Math.round(fp*.1));c.p=clamp(c.p+ +k*st,1,Math.round(fp*2));paint()};
ACT.slist=()=>{const c=S.cur;if(!has(c.id,c.n))return;take(c.id,c.n);G.shop[c.i]={id:c.id,n:c.n,p:c.p};inc('listed');snd('pop');open('shop');upd()};
ACT.srem=k=>{const s=G.shop[+k];if(!s||!give(s.id,s.n))return;G.shop[+k]=null;refresh()};
function collectSale(i,e){const s=G.shop[i];if(!s||!s.sold)return;G.coins+=s.p;inc('earn',s.p);inc('shopsold');G.shop[i]=null;if(e)fly('🪙',e.clientX,e.clientY,'hc');addXp(3)}
ACT.scol=(k,e)=>{collectSale(+k,e);snd('coin');refresh()};
ACT.scolall=(k,e)=>{G.shop.forEach((s,i)=>collectSale(i,null));snd('coin');refresh()};
// truck
ACT.deliver=(k,e)=>{const o=G.ord[+k];if(!o||!o.need||!needOk(o.need))return;Object.entries(o.need).forEach(([a,n])=>take(a,n));G.coins+=o.coins;G.gems+=o.gem;inc('truck');if(e){fx(e.clientX,e.clientY,`+🪙${o.coins}`);fly('🪙',e.clientX,e.clientY,'hc')}G.ord[+k]={wait:now()+du(20)};snd('lvl');truckGo();addXp(o.xp);refresh()};
ACT.otrash=k=>{G.ord[+k]={wait:now()+du(45)};refresh()};
ACT.vis=()=>{if(G.vis)open('vis')};
ACT.vdel=(k,e)=>{const v=G.vis;if(!v||!needOk(v.need))return;Object.entries(v.need).forEach(([a,n])=>take(a,n));G.coins+=v.coins;G.gems+=v.gem;inc('truck');G.vis=null;closeS();snd('lvl');toast(`${v.em} Thank you! +🪙${v.coins} +💎${v.gem}`);addXp(v.xp);upd()};
// neighbors
ACT.nb=()=>open('nb');
ACT.nbv=k=>open('nbv',{i:+k});
ACT.nbb=k=>{const[i,j]=k.split(':').map(Number);nbDay();const s=nbStock(i)[j],p=Math.round(I[s.id].b*s.n*s.mul);if(G.nb.bought[k]||G.coins<p||!give(s.id,s.n))return;G.coins-=p;G.nb.bought[k]=1;snd('coin');refresh()};
ACT.nbh=(k,e)=>{const i=+k,t=now();if((G.nb.help[i]||0)>t)return;G.nb.help[i]=t+du(90);G.nb.hearts[i]=(G.nb.hearts[i]||0)+1;G.coins+=10;inc('help');if(G.nb.hearts[i]%5==0){G.gems++;toast('💖 Best friends! +💎1')}else toast(`${NBS[i][1]} ${NBS[i][0]} says thanks! +🪙10`);snd('coin');addXp(4);refresh()};
// store / settings
ACT.dec=()=>open('dec');
ACT.decor=k=>{const d=DC.find(x=>x[0]==k);if(!d||G.coins<d[3]||G.lv<d[4]||G.decor.includes(k))return;G.coins-=d[3];G.decor.push(k);drawDecor();snd('lvl');refresh()};
ACT.cos=k=>{const[g,id]=k.split(':'),it=COS[g].find(x=>x[0]==id);if(!G.own.includes(id)){if(G.coins<it[3])return toast('Not enough coins',1);G.coins-=it[3];G.own.push(id)}G.eq[g]=id;look();if(g=='hat')penRows();snd('pop');refresh()};
ACT.set=k=>{G.set[k]=G.set[k]?0:1;if(k=='fast')toast(G.set.fast?'Quick timers on for new timers':'Normal timers');paint();save()};
ACT.reset=()=>{if(!S.cur.rs){S.cur.rs=1;return paint()}try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
// games / daily
ACT.game=k=>{const g=GAMES[k];if(!g)return;if((G.cd[k]||0)>now())return toast('Come back soon!');open('game',{k});g.i()};
ACT.go=()=>GM&&GM();
ACT.dclaim=k=>{const r=DR[+k-1];G.coins+=r[0];G.gems+=r[1];G.daily={day:dayN(),streak:+k};snd('lvl');nextPop();upd()};
function look(){document.body.dataset.th=G.eq.theme;const f=$('fld');if(f){f.dataset.pl=G.eq.plot;f.dataset.fn=G.eq.fence}}

/* ================= PARTICLES / BUGS ================= */
function drift(){const k=G.eq.fx;if(k=='none'||document.hidden)return;const a=FX[k],d=document.createElement('div');d.className='pt';d.textContent=a[rnd(a.length)];d.style.left=R()*100+'vw';d.style.fontSize=12+R()*10+'px';d.style.animationDuration=7+R()*5+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),12500)}
function bug(){if(document.hidden||S.cur||W=='Storm')return;const b=document.createElement('div');b.className='bug';const bp=bugPool();b.textContent=bp[rnd(bp.length)];b.style.left='-30px';b.style.top=150+R()*300+'px';b.onpointerdown=e=>{const c=3+rnd(8);G.coins+=c;fx(e.clientX,e.clientY,'+🪙'+c);snd('coin');b.remove();upd()};document.body.appendChild(b);setTimeout(()=>b.remove(),7200)}

/* ================= LOOP / BOOT ================= */
function wander(){if(!S.cur||S.cur.t!='pen')return;const p=$('padd');if(!p)return;const w=p.clientWidth,h=p.clientHeight;p.querySelectorAll('.an').forEach(a=>{if(R()<.4)return;const x=6+R()*Math.max(10,w-64),y=22+R()*Math.max(10,h-70);a.classList.toggle('flip',x>a.offsetLeft);a.style.left=x+'px';a.style.top=y+'px'})}
let tk=0;
function tick(){const t=now();G.seen=t;sky();fieldTick(t);custTick(t,true);ensureOrd();visTick(t);quests();ribbons();bub();fbar();
 if(S.cur){document.querySelectorAll('#sh [data-e]').forEach(e=>{e.textContent=fmt(+e.dataset.e-t)});if(AUTO[S.cur.t]&&sigOf(S.cur)!==S.sig)paint()}
 hud();if(++tk%5==0)save()}
function away(){const t=now(),d=t-(G.seen||t);G.seen=t;if(d<90)return;const sold=custTick(t,false),pl=G.pl.filter(p=>p.s==2&&t>=p.e||p.s==3).length;let pr=0;PROD.forEach(b=>{if(G.bt[b])pr+=Q(b).it.filter(x=>x.end<=t).length});let an=0;PENS.forEach(p=>(G.an[p]||[]).forEach(a=>{if(a.f&&t>=a.e)an++}));
 if(sold||pl||pr||an)pop(`<div class="em">🌤️</div><h2>Welcome back!</h2><p class="mut">While you were away…</p>${sold?`<p>🏪 Customers bought ${sold} stack${sold>1?'s':''}</p>`:''}${pl?`<p>🌾 ${pl} field${pl>1?'s are':' is'} ready</p>`:''}${pr?`<p>🏭 ${pr} item${pr>1?'s':''} finished</p>`:''}${an?`<p>🐔 ${an} animal${an>1?'s have':' has'} produced</p>`:''}<button class="btn g wide" data-a="pc">Let's go</button>`)}
function boot(){load();autoBuild();wxInit();
 $('dk').innerHTML=[['shop','🏪','Shop'],['truck','🚚','Orders'],['sto','📦','Storage'],['nb','🏘️','Friends'],['dec','🎨','Store'],['prof','👤','Me']].map(([k,i,l])=>`<button id="dk-${k}" data-a="dk" data-k="${k}"><b>${i}</b>${l}<u id="dkb-${k}"></u></button>`).join('');
 $('qp').dataset.a='quest';
 buildWorld();look();ensureOrd();hud();fbar();bub();sky();fieldInput();mapInput();
 const m=$('map');m.scrollTop=150;m.scrollLeft=0;
 if(!G.st.intro){G.st.intro=1;pop(`<div class="em">🌾</div><h2>Welcome to Pocket Farm!</h2><p>Tap an empty plot to plant. Tap grown crops to harvest, or drag across them to harvest a whole row.</p><p>Feed animals, bake goods, stock your shop, and fill truck orders. Drag the map to explore.</p><button class="btn g wide" data-a="pc">Start farming</button>`)}
 away();
 if(G.daily.day!=dayN())pop(dailyH(dayN()-G.daily.day==1?G.daily.streak%7+1:1));
 document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f)f(el.dataset.k,e)});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else away()});addEventListener('pagehide',save);
 setInterval(tick,1000);setInterval(wander,2500);setInterval(roam,2600);setInterval(flutter,3600);setInterval(drift,1400);setInterval(bug,45000);
 setInterval(()=>{if(R()<.55)spawnCar()},1400);spawnCar();setTimeout(spawnCar,900);
 save()}
function dailyH(s){return `<div class="em">🎁</div><h2>Daily reward</h2><p class="mut">Day ${s} of 7</p><div class="dr">${DR.map((r,i)=>`<div class="${i+1==s?'on':i+1<s?'dn':''}">${i+1}<br>${r[0]?'🪙'+r[0]:''}${r[1]?'<br>💎'+r[1]:''}</div>`).join('')}</div><button class="btn g wide" data-a="dclaim" data-k="${s}">Claim</button>`}
boot();
})();

</script>
</body>
</html>
